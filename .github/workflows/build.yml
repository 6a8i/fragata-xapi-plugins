name: Build

# builds the RPMs of the package in the XCP-ng 8.3 build environment, the one of the Fragata Host channel
on:
  push:
  pull_request:

jobs:
  rpm:
    runs-on: ubuntu-24.04
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v4
        with:
          lfs: true

      # the actions run on the runner: their Node needs a newer glibc than the EL7 of the build environment
      - name: Build
        run: |
          mkdir -p out
          docker run --rm --user root -v "$PWD:/src" ghcr.io/xcp-ng/xcp-ng-build-env:8.3 sh -ec '
            mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
            cp /src/SPECS/*.spec ~/rpmbuild/SPECS/
            cp /src/SOURCES/* ~/rpmbuild/SOURCES/
            spec=$(ls ~/rpmbuild/SPECS/*.spec)
            yum-builddep -q -y "$spec"
            rpmbuild -ba "$spec"
            cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm /src/out/
          '
          ls -l out

      # https://github.com/actions/upload-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: out/*.rpm
